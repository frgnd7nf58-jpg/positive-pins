<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <meta
        name="theme-color"
        content="#fff0f6"
        id="themeColour"
    >

    <title>Positive Pins</title>


    <style>

        * {
            box-sizing: border-box;
        }


        body {
            margin: 0;
            min-height: 100vh;
            min-height: 100dvh;

            display: flex;
            justify-content: center;
            align-items: center;

            padding: 25px;

            font-family:
                Arial,
                Helvetica,
                sans-serif;

            background:
                linear-gradient(
                    135deg,
                    #fff0f6,
                    #eef8ff
                );

            transition:
                background 0.9s ease;
        }


        /*
            Full-screen colour layer.

            This gives us a softer visual transition
            when the theme changes.
        */

        #backgroundLayer {
            position: fixed;

            inset: 0;

            z-index: -1;

            background:
                linear-gradient(
                    135deg,
                    #fff0f6,
                    #eef8ff
                );

            transition:
                background 0.9s ease;
        }


        .card {
            width: 100%;
            max-width: 420px;

            background:
                rgba(255, 255, 255, 0.94);

            border:
                3px solid
                rgba(255, 255, 255, 0.8);

            border-radius: 30px;

            padding:
                40px
                30px;

            text-align: center;

            box-shadow:
                0 15px 40px
                rgba(0, 0, 0, 0.12);

            overflow: hidden;

            backdrop-filter:
                blur(8px);

            -webkit-backdrop-filter:
                blur(8px);

            transition:
                box-shadow 0.8s ease,
                border-color 0.8s ease;
        }


        .icon {
            min-height: 105px;

            display: flex;
            justify-content: center;
            align-items: center;

            font-size: 80px;
        }


        h1 {
            margin:
                10px
                0
                0;

            min-height: 35px;

            font-size: 24px;

            color: #555;

            transition:
                color 0.8s ease;
        }


        #message {
            margin:
                30px
                0
                35px;

            min-height: 120px;

            display: flex;
            justify-content: center;
            align-items: center;

            font-size: 28px;
            font-weight: bold;

            line-height: 1.4;

            color: #222;
        }


        button {
            border: none;

            padding:
                15px
                25px;

            border-radius: 50px;

            font-size: 18px;
            font-weight: bold;

            background: #444;
            color: white;

            cursor: pointer;

            box-shadow:
                0 5px 15px
                rgba(0, 0, 0, 0.15);

            transition:
                background 0.8s ease,
                transform 0.15s ease,
                opacity 0.15s ease,
                box-shadow 0.8s ease;
        }


        button:hover {
            transform:
                translateY(-1px)
                scale(1.03);
        }


        button:active {
            transform:
                scale(0.97);
        }


        button:disabled {
            opacity: 0.6;

            cursor: default;

            transform: none;
        }


        .footer {
            margin-top: 30px;

            font-size: 14px;

            color: #777;
        }



        /* ============================== */
        /* REVEAL ANIMATIONS              */
        /* ============================== */


        .thinking {
            animation:
                pulse
                0.65s
                ease-in-out
                infinite
                alternate;
        }


        .icon-reveal {
            animation:
                iconPop
                0.55s
                cubic-bezier(
                    0.34,
                    1.56,
                    0.64,
                    1
                )
                forwards;
        }


        .title-reveal {
            animation:
                fadeDown
                0.45s
                ease
                forwards;
        }


        .message-reveal {
            animation:
                messageReveal
                0.6s
                ease
                forwards;
        }


        @keyframes pulse {

            from {
                transform:
                    scale(0.9);

                opacity:
                    0.45;
            }

            to {
                transform:
                    scale(1.15);

                opacity:
                    1;
            }

        }


        @keyframes iconPop {

            0% {
                transform:
                    scale(0)
                    rotate(-10deg);

                opacity:
                    0;
            }

            65% {
                transform:
                    scale(1.2)
                    rotate(4deg);

                opacity:
                    1;
            }

            100% {
                transform:
                    scale(1)
                    rotate(0deg);

                opacity:
                    1;
            }

        }


        @keyframes fadeDown {

            from {
                opacity:
                    0;

                transform:
                    translateY(-10px);
            }

            to {
                opacity:
                    1;

                transform:
                    translateY(0);
            }

        }


        @keyframes messageReveal {

            from {
                opacity:
                    0;

                transform:
                    translateY(20px)
                    scale(0.96);
            }

            to {
                opacity:
                    1;

                transform:
                    translateY(0)
                    scale(1);
            }

        }


        /* ============================== */
        /* THEME MICRO-ANIMATIONS         */
        /* ============================== */

        .icon-reveal.theme-frog { animation: iconPop 0.55s cubic-bezier(0.34, 1.56, 0.64, 1) forwards, frogHop 0.65s ease 0.55s both; }

        .icon-reveal.theme-butterfly { animation: iconPop 0.55s cubic-bezier(0.34, 1.56, 0.64, 1) forwards, butterflyFlutter 0.75s ease 0.55s both; }

        .icon-reveal.theme-cloud { animation: iconPop 0.55s cubic-bezier(0.34, 1.56, 0.64, 1) forwards, cloudFloat 0.9s ease 0.55s both; }
        .icon-reveal.theme-mushroom { animation: iconPop 0.55s cubic-bezier(0.34, 1.56, 0.64, 1) forwards, mushroomSprout 0.65s ease 0.55s both; }
        .icon-reveal.theme-dinosaur { animation: iconPop 0.55s cubic-bezier(0.34, 1.56, 0.64, 1) forwards, dinosaurStomp 0.7s ease 0.55s both; }
        .icon-reveal.theme-dragon { animation: iconPop 0.55s cubic-bezier(0.34, 1.56, 0.64, 1) forwards, dragonBreathe 0.85s ease 0.55s both; }
        .icon-reveal.theme-unicorn { animation: iconPop 0.55s cubic-bezier(0.34, 1.56, 0.64, 1) forwards, unicornSparkle 0.8s ease 0.55s both; }
        .icon-reveal.theme-penguin { animation: iconPop 0.55s cubic-bezier(0.34, 1.56, 0.64, 1) forwards, penguinWaddle 0.8s ease 0.55s both; }
        .icon-reveal.theme-otter { animation: iconPop 0.55s cubic-bezier(0.34, 1.56, 0.64, 1) forwards, otterBob 0.8s ease 0.55s both; }
        .icon-reveal.theme-hedgehog { animation: iconPop 0.55s cubic-bezier(0.34, 1.56, 0.64, 1) forwards, hedgehogRoll 0.8s ease 0.55s both; }
        .icon-reveal.theme-rocket { animation: iconPop 0.55s cubic-bezier(0.34, 1.56, 0.64, 1) forwards, rocketLaunch 0.8s ease 0.55s both; }
        .icon-reveal.theme-d20 { animation: iconPop 0.55s cubic-bezier(0.34, 1.56, 0.64, 1) forwards, diceRoll 0.8s ease 0.55s both; }
        .icon-reveal.theme-dnd { animation: iconPop 0.55s cubic-bezier(0.34, 1.56, 0.64, 1) forwards, wizardCast 0.8s ease 0.55s both; }
        .icon-reveal.theme-doughnut { animation: iconPop 0.55s cubic-bezier(0.34, 1.56, 0.64, 1) forwards, doughnutSpin 0.8s ease 0.55s both; }
        .icon-reveal.theme-cookie { animation: iconPop 0.55s cubic-bezier(0.34, 1.56, 0.64, 1) forwards, cookieBounce 0.7s ease 0.55s both; }
        .icon-reveal.theme-strawberry { animation: iconPop 0.55s cubic-bezier(0.34, 1.56, 0.64, 1) forwards, strawberryBounce 0.7s ease 0.55s both; }
        .icon-reveal.theme-general { animation: iconPop 0.55s cubic-bezier(0.34, 1.56, 0.64, 1) forwards, gentleSparkle 0.8s ease 0.55s both; }

        @keyframes frogHop { 40% { transform: translateY(-9px) rotate(-3deg); } 70% { transform: translateY(2px) rotate(2deg); } }
        @keyframes beeBuzz { 25%, 75% { transform: translateX(-3px) rotate(-4deg); } 50% { transform: translateX(3px) rotate(4deg); } }
        @keyframes catPurr { 35% { transform: scale(1.04) rotate(-2deg); } 70% { transform: scale(0.99) rotate(2deg); } }
        @keyframes dogWag { 30%, 70% { transform: rotate(-5deg); } 50%, 90% { transform: rotate(5deg); } }
        @keyframes turtleNod { 40% { transform: translateY(3px) scaleY(0.96); } 70% { transform: translateY(-2px); } }
        @keyframes butterflyFlutter { 25%, 75% { transform: scaleX(0.9) rotate(-3deg); } 50% { transform: scaleX(1.08) rotate(3deg); } }
        @keyframes sunflowerSway { 35% { transform: rotate(-5deg); } 70% { transform: rotate(5deg); } }
        @keyframes rainbowRise { 45% { transform: translateY(-7px) scale(1.04); } }
        @keyframes starTwinkle { 35% { transform: scale(1.15) rotate(6deg); filter: brightness(1.18); } 70% { transform: scale(0.98) rotate(-3deg); } }
        @keyframes moonDrift { 45% { transform: translate(-5px, -4px) rotate(-4deg); } }
        @keyframes cloudFloat { 35% { transform: translateX(-7px); } 70% { transform: translateX(7px); } }
        @keyframes mushroomSprout { 35% { transform: translateY(5px) scaleY(0.9); } 70% { transform: translateY(-5px) scaleY(1.06); } }
        @keyframes dinosaurStomp { 30%, 70% { transform: translateY(2px) rotate(-3deg); } 50% { transform: translateY(-3px) rotate(3deg); } }
        @keyframes dragonBreathe { 45% { transform: scale(1.07); filter: drop-shadow(0 0 6px rgba(255, 145, 82, 0.55)); } }
        @keyframes unicornSparkle { 35% { transform: translateY(-4px) rotate(-4deg); filter: brightness(1.2); } 70% { transform: rotate(4deg); } }
        @keyframes penguinWaddle { 25%, 75% { transform: translateX(-3px) rotate(-5deg); } 50% { transform: translateX(3px) rotate(5deg); } }
        @keyframes otterBob { 35% { transform: translateY(-5px) rotate(3deg); } 70% { transform: translateY(2px) rotate(-3deg); } }
        @keyframes hedgehogRoll { 45% { transform: translateX(7px) rotate(12deg); } 75% { transform: translateX(-2px) rotate(-4deg); } }
        @keyframes rocketLaunch { 35% { transform: translateY(3px); } 70% { transform: translateY(-11px) rotate(3deg); } }
        @keyframes diceRoll { 45% { transform: rotate(18deg) scale(1.08); } 75% { transform: rotate(-6deg); } }
        @keyframes wizardCast { 35% { transform: rotate(-6deg) scale(1.05); filter: brightness(1.18); } 70% { transform: rotate(5deg); } }
        @keyframes doughnutSpin { 55% { transform: rotate(16deg) scale(1.04); } }
        @keyframes cookieBounce { 40% { transform: translateY(-6px) rotate(-5deg); } 70% { transform: translateY(1px) rotate(3deg); } }
        @keyframes strawberryBounce { 40% { transform: translateY(-7px) scale(1.05); } 70% { transform: translateY(1px) scale(0.99); } }
        @keyframes gentleSparkle { 40% { transform: scale(1.1) rotate(5deg); filter: brightness(1.16); } 75% { transform: scale(0.99) rotate(-2deg); } }

        /* Golden Pins are rare, decorative surprises with no prize attached. */

        .golden-banner {
            display: none;
            width: fit-content;
            margin: 0 auto 2px;
            padding: 6px 12px;
            border: 1px solid rgba(173, 120, 13, 0.35);
            border-radius: 999px;
            color: #805a08;
            background: linear-gradient(110deg, #fff4bd, #ffe083, #fff7ce);
            font-size: 13px;
            font-weight: bold;
            letter-spacing: 0.02em;
        }

        .card.is-golden {
            border-color: rgba(205, 151, 31, 0.75) !important;
            box-shadow: 0 15px 48px rgba(201, 146, 28, 0.34) !important;
        }

        .card.is-golden .golden-banner {
            display: inline-flex;
            animation: goldenGlow 1.2s ease-in-out both;
        }

        .card.is-golden .icon {
            filter: drop-shadow(0 0 8px rgba(231, 178, 53, 0.48));
        }

        @keyframes goldenGlow {
            45% { transform: scale(1.04); filter: brightness(1.08); }
        }

        /* A quiet, temporary celebration for local-only milestones. */

        #milestone {
            min-height: 22px;
            margin: -18px 0 18px;
            color: #6f627b;
            font-size: 13px;
            font-weight: bold;
            opacity: 0;
            transform: translateY(4px);
            transition: opacity 0.3s ease, transform 0.3s ease, color 0.8s ease;
        }

        #milestone.show {
            opacity: 1;
            transform: translateY(0);
        }



        /*
            Slight adjustment for smaller phones.
        */

        @media (max-width: 420px) {

    body {
        align-items: flex-start;

        padding:
            max(20px, env(safe-area-inset-top))
            16px
            30px;
    }

    .card {
        padding:
            32px
            22px;

        border-radius:
            25px;
    }

    .icon {
        font-size:
            70px;
    }

    h1 {
        font-size:
            21px;
    }

    #message {
        font-size:
            24px;
    }

    button {
        font-size:
            17px;

        width:
            100%;
    }

        }



        /*
            Respect accessibility settings.
        */

        @media (prefers-reduced-motion: reduce) {

            *,
            *::before,
            *::after {

                animation-duration:
                    0.01ms !important;

                animation-iteration-count:
                    1 !important;

                transition-duration:
                    0.01ms !important;

            }

        }

    </style>

</head>



<body>


    <div id="backgroundLayer"></div>


    <div
        class="card"
        id="card"
    >


        <div
            class="icon"
            id="icon"
        >
            ✨
        </div>


        <div
            class="golden-banner"
            id="goldenBanner"
            role="status"
            aria-live="polite"
            aria-hidden="true"
        >
            ✨ You found a Golden Pin! ✨
        </div>


        <h1 id="title">
            A little positivity for you
        </h1>


        <div id="message"></div>


        <div
            id="milestone"
            role="status"
            aria-live="polite"
        ></div>


        <button
            id="anotherButton"
            onclick="showMessage()"
        >
            Give me another ✨
        </button>


        <div class="footer">
            Take what you need today.
        </div>


    </div>



    <!--
        Our separate library containing
        all 500 Positive Pins messages.
    -->

    <script src="messages.js"></script>



    <script>


        /*

        end:

        accent:

        glow:

        */


        const themeStyles = {

        /*
        ==========================================
        LOCAL PROGRESS & GENTLE SURPRISES
        ==========================================

        Progress never leaves this browser. There
        is no account, analytics call or server.
        */

        const progressStorageKey =
            "positivePinsProgressV1";

        const goldenPinChance =
            25;

        const prefersReducedMotion =
            window.matchMedia(
                "(prefers-reduced-motion: reduce)"
            ).matches;

        const revealDelays =
            prefersReducedMotion
                ? {
                    colours: 0,
                    icon: 0,
                    title: 0,
                    message: 20,
                    finish: 80
                }
                : {
                    colours: 180,
                    icon: 450,
                    title: 720,
                    message: 980,
                    finish: 1500
                };

        let memoryProgress = {
            totalReveals: 0,
            discoveredThemes: [],
            celebrated: []
        };

        let milestoneTimer;

        const milestoneRules = [
            {
                id: "themes-5",
                reached: progress =>
                    progress.discoveredThemes.length >= 5,
                text: "A lovely little collection — 5 themes discovered ✨"
            },
            {
                id: "reveals-5",
                reached: progress =>
                    progress.totalReveals >= 5,
                text: "Five little moments of positivity ✨"
            },
            {
                id: "themes-10",
                reached: progress =>
                    progress.discoveredThemes.length >= 10,
                text: "So many friendly faces — 10 themes discovered 🌈"
            },
            {
                id: "reveals-10",
                reached: progress =>
                    progress.totalReveals >= 10,
                text: "Ten positive pins, just for you 💛"
            },
            {
                id: "themes-15",
                reached: progress =>
                    progress.discoveredThemes.length >= 15,
                text: "A colourful collection — 15 themes discovered ✨"
            },
            {
                id: "reveals-25",
                reached: progress =>
                    progress.totalReveals >= 25,
                text: "Twenty-five uplifting moments collected 🌟"
            },
            {
                id: "themes-20",
                reached: progress =>
                    progress.discoveredThemes.length >= 20,
                text: "Twenty themes discovered — what a cheerful mix!"
            },
            {
                id: "reveals-50",
                reached: progress =>
                    progress.totalReveals >= 50,
                text: "Fifty little boosts of positivity 💫"
            },
            {
                id: "themes-all",
                reached: progress =>
                    progress.discoveredThemes.length >= 25,
                text: "Every theme discovered — a full rainbow of pins 🌈"
            },
            {
                id: "reveals-100",
                reached: progress =>
                    progress.totalReveals >= 100,
                text: "One hundred kind moments — keep what helps you 💛"
            }
        ];

        function cleanProgress(value) {

            if (
                !value ||
                typeof value !== "object"
            ) {
                return {
                    totalReveals: 0,
                    discoveredThemes: [],
                    celebrated: []
                };
            }

            return {
                totalReveals:
                    Number.isFinite(
                        value.totalReveals
                    )
                        ? Math.max(
                            0,
                            Math.floor(
                                value.totalReveals
                            )
                        )
                        : 0,
                discoveredThemes:
                    Array.isArray(
                        value.discoveredThemes
                    )
                        ? value.discoveredThemes
                            .filter(
                                item =>
                                    typeof item ===
                                    "string"
                            )
                            .slice(
                                0,
                                25
                            )
                        : [],
                celebrated:
                    Array.isArray(
                        value.celebrated
                    )
                        ? value.celebrated
                            .filter(
                                item =>
                                    typeof item ===
                                    "string"
                            )
                        : []
            };

        }

        function readProgress() {

            try {

                const saved =
                    localStorage.getItem(
                        progressStorageKey
                    );

                if (saved) {
                    memoryProgress =
                        cleanProgress(
                            JSON.parse(
                                saved
                            )
                        );
                }

            } catch (error) {

                /*
                    Private browsing or strict
                    settings can disable storage.
                    The page still works normally.
                */

            }

            return cleanProgress(
                memoryProgress
            );

        }

        function saveProgress(progress) {

            memoryProgress =
                cleanProgress(
                    progress
                );

            try {

                localStorage.setItem(
                    progressStorageKey,
                    JSON.stringify(
                        memoryProgress
                    )
                );

            } catch (error) {

                /*
                    Keep the in-memory version so
                    storage is never required.
                */

            }

        }

        function recordProgress(themeId) {

            const progress =
                readProgress();

            progress.totalReveals +=
                1;

            if (
                !progress.discoveredThemes
                    .includes(
                        themeId
                    )
            ) {
                progress.discoveredThemes
                    .push(
                        themeId
                    );
            }

            const milestone =
                milestoneRules.find(
                    rule =>
                        !progress.celebrated
                            .includes(
                                rule.id
                            )
                        &&
                        rule.reached(
                            progress
                        )
                );

            if (milestone) {
                progress.celebrated
                    .push(
                        milestone.id
                    );
            }

            saveProgress(
                progress
            );

            return milestone
                ? milestone.text
                : "";

        }

        function hideMilestone() {

            clearTimeout(
                milestoneTimer
            );

            const milestone =
                document.getElementById(
                    "milestone"
                );

            milestone.className =
                "";

            milestone.textContent =
                "";

        }

        function showMilestone(text) {

            if (!text) {
                return;
            }

            const milestone =
                document.getElementById(
                    "milestone"
                );

            milestone.textContent =
                text;

            milestone.className =
                "show";

            milestoneTimer =
                setTimeout(
                    hideMilestone,
                    prefersReducedMotion
                        ? 3200
                        : 4800
                );

        }



        let previousTheme =
            -1;


        let previousMessage =
            -1;


        let revealing =
            false;



        /*
        ==========================================
        APPLY THEME COLOURS
        ==========================================
        */


        function applyThemeColours(theme) {


            const style =
                themeStyles[theme.id] ||
                themeStyles.general;


            const background =
                `linear-gradient(
                    135deg,
                    ${style.start},
                    ${style.end}
                )`;


            document
                .getElementById(
                    "backgroundLayer"
                )
                .style
                .background =
                background;


            const card =
                document.getElementById(
                    "card"
                );


            card.style.borderColor =
                style.accent + "55";


            card.style.boxShadow =
                `
                0 15px 45px
                ${style.glow}
                `;


            const title =
                document.getElementById(
                    "title"
                );


            title.style.color =
                style.accent;


            const button =
                document.getElementById(
                    "anotherButton"
                );


            button.style.background =
                style.accent;


            button.style.boxShadow =
                `
                0 5px 18px
                ${style.glow}
                `;


            /*
                Also changes the browser's
                mobile toolbar colour
                where supported.
            */

            document
                .getElementById(
                    "themeColour"
                )
                .setAttribute(
                    "content",
                    style.start
                );

        }



        /*
        ==========================================
        SHOW RANDOM MESSAGE
        ==========================================
        */


        function showMessage() {


            if (revealing) {
                return;
            }


            revealing =
                true;


            const themes =
                window.positivePinThemes;


            if (
                !themes ||
                themes.length === 0
            ) {

                document
                    .getElementById(
                        "message"
                    )
                    .textContent =
                    "Something went wrong loading the messages.";


                revealing =
                    false;


                return;
            }



            /*
            ------------------------------
            CHOOSE RANDOM THEME
            ------------------------------
            */


            let themeNumber;


            do {

                themeNumber =
                    Math.floor(
                        Math.random() *
                        themes.length
                    );

            } while (

                themeNumber ===
                previousTheme

                &&

                themes.length > 1

            );


            const theme =
                themes[
                    themeNumber
                ];



            /*
            ------------------------------
            CHOOSE RANDOM MESSAGE
            ------------------------------
            */


            let messageNumber;


            do {

                messageNumber =
                    Math.floor(
                        Math.random() *
                        theme.messages.length
                    );

            } while (

                themeNumber ===
                previousTheme

                &&

                messageNumber ===
                previousMessage

                &&

                theme.messages.length > 1

            );


            previousTheme =
                themeNumber;


            previousMessage =
                messageNumber;


            const isGoldenPin =
                Math.floor(
                    Math.random() *
                    goldenPinChance
                ) === 0;



            /*
            ------------------------------
            GET PAGE ELEMENTS
            ------------------------------
            */


            const icon =
                document.getElementById(
                    "icon"
                );


            const title =
                document.getElementById(
                    "title"
                );


            const message =
                document.getElementById(
                    "message"
                );


            const button =
                document.getElementById(
                    "anotherButton"
                );


            const card =
                document.getElementById(
                    "card"
                );


            const goldenBanner =
                document.getElementById(
                    "goldenBanner"
                );



            /*
            ------------------------------
            RESET PAGE FOR REVEAL
            ------------------------------
            */


            hideMilestone();


            card.classList.remove(
                "is-golden"
            );


            goldenBanner.setAttribute(
                "aria-hidden",
                "true"
            );


            icon.className =
                "icon thinking";


            title.className =
                "";


            message.className =
                "";


            icon.textContent =
                "✨";


            title.textContent =
                "Finding something for you...";


            message.textContent =
                "";


            button.disabled =
                true;


            button.textContent =
                "Finding one... ✨";



            /*
            ------------------------------
            COLOUR TRANSITION
            ------------------------------
            */


            setTimeout(
                function() {

                    applyThemeColours(
                        theme
                    );

                },
                revealDelays.colours
            );



            /*
            ------------------------------
            REVEAL ICON & THEME MOTION
            ------------------------------
            */


            setTimeout(
                function() {

                    icon.className =
                        "icon icon-reveal theme-" +
                        theme.id;


                    icon.textContent =
                        theme.icon;


                    if (isGoldenPin) {

                        card.classList.add(
                            "is-golden"
                        );


                        goldenBanner.setAttribute(
                            "aria-hidden",
                            "false"
                        );

                    }

                },
                revealDelays.icon
            );



            /*
            ------------------------------
            REVEAL TITLE
            ------------------------------
            */


            setTimeout(
                function() {

                    title.textContent =
                        theme.title;


                    title.className =
                        "title-reveal";

                },
                revealDelays.title
            );



            /*
            ------------------------------
            REVEAL MESSAGE & PROGRESS
            ------------------------------
            */


            setTimeout(
                function() {

                    message.textContent =
                        theme.messages[
                            messageNumber
                        ];


                    message.className =
                        "message-reveal";


                    showMilestone(
                        recordProgress(
                            theme.id
                        )
                    );

                },
                revealDelays.message
            );



            /*
            ------------------------------
            FINISH REVEAL
            ------------------------------
            */


            setTimeout(
                function() {

                    button.disabled =
                        false;


                    button.textContent =
                        "Give me another ✨";


                    revealing =
                        false;

                },
                revealDelays.finish
            );

        }



        /*
        ==========================================
        FIRST NFC / PAGE OPEN
        ==========================================

        As soon as the page loads,
        perform the reveal automatically.
        */


        showMessage();


    </script>


</body>

</html>
