<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Positive Pins</title>

    <style>

        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 100vh;

            display: flex;
            justify-content: center;
            align-items: center;

            padding: 25px;

            font-family: Arial, sans-serif;

            background: linear-gradient(
                135deg,
                #fff0f6,
                #eef8ff
            );
        }


        .card {
            width: 100%;
            max-width: 500px;

            background: white;

            border-radius: 30px;

            padding: 40px 30px;

            text-align: center;

            box-shadow:
                0 10px 30px rgba(0,0,0,0.12);

            overflow: hidden;
        }


        .icon {
            font-size: 80px;

            min-height: 100px;

            display: flex;
            justify-content: center;
            align-items: center;
        }


        h1 {
            margin-top: 10px;

            min-height: 35px;

            font-size: 24px;

            color: #555;
        }


        #message {
            margin: 30px 0 35px;

            min-height: 120px;

            display: flex;
            justify-content: center;
            align-items: center;

            font-size: 28px;
            font-weight: bold;

            line-height: 1.4;
        }


        button {
            border: none;

            padding: 15px 25px;

            border-radius: 50px;

            font-size: 18px;

            background: #333;
            color: white;

            cursor: pointer;

            transition:
                transform 0.15s ease,
                opacity 0.15s ease;
        }


        button:hover {
            transform: scale(1.03);
        }


        button:active {
            transform: scale(0.97);
        }


        button:disabled {
            opacity: 0.6;
            cursor: default;
            transform: none;
        }


        .footer {
            margin-top: 30px;

            font-size: 14px;

            color: #777;
        }


        /* -------------------------- */
        /* REVEAL ANIMATIONS          */
        /* -------------------------- */


        .thinking {
            animation:
                pulse 0.65s ease-in-out infinite alternate;
        }


        .icon-reveal {
            animation:
                iconPop 0.55s
                cubic-bezier(0.34, 1.56, 0.64, 1)
                forwards;
        }


        .title-reveal {
            animation:
                fadeDown 0.45s ease forwards;
        }


        .message-reveal {
            animation:
                messageReveal 0.6s ease forwards;
        }


        @keyframes pulse {

            from {
                transform: scale(0.9);
                opacity: 0.5;
            }

            to {
                transform: scale(1.15);
                opacity: 1;
            }

        }


        @keyframes iconPop {

            0% {
                transform: scale(0);
                opacity: 0;
            }

            65% {
                transform: scale(1.2);
                opacity: 1;
            }

            100% {
                transform: scale(1);
                opacity: 1;
            }

        }


        @keyframes fadeDown {

            from {
                opacity: 0;
                transform: translateY(-10px);
            }

            to {
                opacity: 1;
                transform: translateY(0);
            }

        }


        @keyframes messageReveal {

            from {
                opacity: 0;
                transform:
                    translateY(20px)
                    scale(0.96);
            }

            to {
                opacity: 1;
                transform:
                    translateY(0)
                    scale(1);
            }

        }


        /*
            Respect phones/computers where the user
            has reduced motion enabled.
        */

        @media (prefers-reduced-motion: reduce) {

            *,
            *::before,
            *::after {
                animation-duration: 0.01ms !important;
                animation-iteration-count: 1 !important;
                transition-duration: 0.01ms !important;
            }

        }

    </style>

</head>


<body>

    <div class="card">

        <div
            class="icon"
            id="icon"
        >
            ✨
        </div>


        <h1 id="title">
            A little positivity for you
        </h1>


        <div id="message">
        </div>


        <button
            id="anotherButton"
            onclick="showMessage()"
        >
            Give me another ✨
        </button>


        <div class="footer">
            Take what you need today.
        </div>

    </div>



    <!-- Load all 500 Positive Pins messages -->

    <script src="messages.js"></script>



    <script>

        let previousTheme = -1;
        let previousMessage = -1;

        let revealing = false;


        function showMessage() {

            /*
                Prevent someone pressing the button
                several times during the animation.
            */

            if (revealing) {
                return;
            }


            revealing = true;


            const themes =
                window.positivePinThemes;


            if (!themes || themes.length === 0) {

                document.getElementById("message")
                    .textContent =
                    "Something went wrong loading the messages.";

                revealing = false;

                return;
            }


            /* -------------------------- */
            /* PICK A RANDOM THEME        */
            /* -------------------------- */


            let themeNumber;


            do {

                themeNumber =
                    Math.floor(
                        Math.random() *
                        themes.length
                    );

            } while (
                themeNumber === previousTheme &&
                themes.length > 1
            );


            const theme =
                themes[themeNumber];



            /* -------------------------- */
            /* PICK A RANDOM MESSAGE      */
            /* -------------------------- */


            let messageNumber;


            do {

                messageNumber =
                    Math.floor(
                        Math.random() *
                        theme.messages.length
                    );

            } while (
                themeNumber === previousTheme &&
                messageNumber === previousMessage &&
                theme.messages.length > 1
            );


            previousTheme =
                themeNumber;


            previousMessage =
                messageNumber;



            /* -------------------------- */
            /* GET PAGE ELEMENTS          */
            /* -------------------------- */


            const icon =
                document.getElementById("icon");


            const title =
                document.getElementById("title");


            const message =
                document.getElementById("message");


            const button =
                document.getElementById("anotherButton");



            /* -------------------------- */
            /* RESET REVEAL               */
            /* -------------------------- */


            icon.className =
                "icon thinking";


            title.className =
                "";


            message.className =
                "";


            icon.textContent =
                "✨";


            title.textContent =
                "Finding something for you...";


            message.textContent =
                "";


            button.disabled =
                true;


            button.textContent =
                "Finding one... ✨";



            /* -------------------------- */
            /* REVEAL THE ICON            */
            /* -------------------------- */


            setTimeout(function() {

                icon.className =
                    "icon icon-reveal";


                icon.textContent =
                    theme.icon;

            }, 350);



            /* -------------------------- */
            /* REVEAL THE HEADING         */
            /* -------------------------- */


            setTimeout(function() {

                title.textContent =
                    theme.title;


                title.className =
                    "title-reveal";

            }, 650);



            /* -------------------------- */
            /* REVEAL THE MESSAGE         */
            /* -------------------------- */


            setTimeout(function() {

                message.textContent =
                    theme.messages[messageNumber];


                message.className =
                    "message-reveal";

            }, 900);



            /* -------------------------- */
            /* RE-ENABLE BUTTON           */
            /* -------------------------- */


            setTimeout(function() {

                button.disabled =
                    false;


                button.textContent =
                    "Give me another ✨";


                revealing =
                    false;

            }, 1450);

        }



        /*
            Automatically perform the reveal
            when somebody first opens the badge.
        */

        showMessage();

    </script>

</body>

</html>
