<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Positive Pins</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 100vh;

            display: flex;
            justify-content: center;
            align-items: center;

            padding: 25px;

            font-family: Arial, sans-serif;

            background: linear-gradient(
                135deg,
                #fff0f6,
                #eef8ff
            );
        }

        .card {
            width: 100%;
            max-width: 500px;

            background: white;

            border-radius: 30px;

            padding: 40px 30px;

            text-align: center;

            box-shadow:
                0 10px 30px rgba(0,0,0,0.12);
        }

        .icon {
            font-size: 80px;
        }

        h1 {
            margin-top: 15px;

            font-size: 24px;

            color: #555;
        }

        #message {
            margin: 30px 0 35px;

            font-size: 28px;
            font-weight: bold;

            line-height: 1.4;
        }

        button {
            border: none;

            padding: 15px 25px;

            border-radius: 50px;

            font-size: 18px;

            background: #333;
            color: white;

            cursor: pointer;
        }

        button:active {
            transform: scale(0.98);
        }

        .footer {
            margin-top: 30px;

            font-size: 14px;

            color: #777;
        }
    </style>
</head>

<body>

    <div class="card">

        <div class="icon" id="icon">
            ✨
        </div>

        <h1 id="title">
            A little positivity for you
        </h1>

        <div id="message">
            Loading something positive...
        </div>

        <button onclick="showMessage()">
            Give me another ✨
        </button>

        <div class="footer">
            Take what you need today.
        </div>

    </div>


    <!-- Loads the 500-message library -->
    <script src="messages.js"></script>


    <script>

        let previousTheme = -1;
        let previousMessage = -1;


        function showMessage() {

            const themes = window.positivePinThemes;


            if (!themes || themes.length === 0) {

                document.getElementById("message").textContent =
                    "Something went wrong loading the messages.";

                return;
            }


            let themeNumber;


            /*
                Pick a random theme.

                If there is more than one theme,
                don't show the same theme twice in a row.
            */

            do {

                themeNumber =
                    Math.floor(
                        Math.random() * themes.length
                    );

            } while (
                themeNumber === previousTheme &&
                themes.length > 1
            );


            const theme = themes[themeNumber];


            let messageNumber;


            /*
                Pick a random message
                from inside the chosen theme.
            */

            do {

                messageNumber =
                    Math.floor(
                        Math.random() * theme.messages.length
                    );

            } while (
                themeNumber === previousTheme &&
                messageNumber === previousMessage &&
                theme.messages.length > 1
            );


            previousTheme = themeNumber;
            previousMessage = messageNumber;


            document.getElementById("icon").textContent =
                theme.icon;


            document.getElementById("title").textContent =
                theme.title;


            document.getElementById("message").textContent =
                theme.messages[messageNumber];

        }


        showMessage();

    </script>

</body>

</html>
