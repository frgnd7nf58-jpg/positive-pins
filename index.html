<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <meta
        name="theme-color"
        content="#fff0f6"
        id="themeColour"
    >

    <title>Positive Pins</title>


    <style>

        * {
            box-sizing: border-box;
        }


        body {
            margin: 0;
            min-height: 100vh;

            display: flex;
            justify-content: center;
            align-items: center;

            padding: 25px;

            font-family:
                Arial,
                Helvetica,
                sans-serif;

            background:
                linear-gradient(
                    135deg,
                    #fff0f6,
                    #eef8ff
                );

            transition:
                background 0.9s ease;
        }


        /*
            Full-screen colour layer.

            This gives us a softer visual transition
            when the theme changes.
        */

        #backgroundLayer {
            position: fixed;

            inset: 0;

            z-index: -1;

            background:
                linear-gradient(
                    135deg,
                    #fff0f6,
                    #eef8ff
                );

            transition:
                background 0.9s ease;
        }


        .card {
            width: 100%;
            max-width: 420px;

            background:
                rgba(255, 255, 255, 0.94);

            border:
                3px solid
                rgba(255, 255, 255, 0.8);

            border-radius: 30px;

            padding:
                40px
                30px;

            text-align: center;

            box-shadow:
                0 15px 40px
                rgba(0, 0, 0, 0.12);

            overflow: hidden;

            backdrop-filter:
                blur(8px);

            -webkit-backdrop-filter:
                blur(8px);

            transition:
                box-shadow 0.8s ease,
                border-color 0.8s ease;
        }


        .icon {
            min-height: 105px;

            display: flex;
            justify-content: center;
            align-items: center;

            font-size: 80px;
        }


        h1 {
            margin:
                10px
                0
                0;

            min-height: 35px;

            font-size: 24px;

            color: #555;

            transition:
                color 0.8s ease;
        }


        #message {
            margin:
                30px
                0
                35px;

            min-height: 120px;

            display: flex;
            justify-content: center;
            align-items: center;

            font-size: 28px;
            font-weight: bold;

            line-height: 1.4;

            color: #222;
        }


        button {
            border: none;

            padding:
                15px
                25px;

            border-radius: 50px;

            font-size: 18px;
            font-weight: bold;

            background: #444;
            color: white;

            cursor: pointer;

            box-shadow:
                0 5px 15px
                rgba(0, 0, 0, 0.15);

            transition:
                background 0.8s ease,
                transform 0.15s ease,
                opacity 0.15s ease,
                box-shadow 0.8s ease;
        }


        button:hover {
            transform:
                translateY(-1px)
                scale(1.03);
        }


        button:active {
            transform:
                scale(0.97);
        }


        button:disabled {
            opacity: 0.6;

            cursor: default;

            transform: none;
        }


        .footer {
            margin-top: 30px;

            font-size: 14px;

            color: #777;
        }



        /* ============================== */
        /* REVEAL ANIMATIONS              */
        /* ============================== */


        .thinking {
            animation:
                pulse
                0.65s
                ease-in-out
                infinite
                alternate;
        }


        .icon-reveal {
            animation:
                iconPop
                0.55s
                cubic-bezier(
                    0.34,
                    1.56,
                    0.64,
                    1
                )
                forwards;
        }


        .title-reveal {
            animation:
                fadeDown
                0.45s
                ease
                forwards;
        }


        .message-reveal {
            animation:
                messageReveal
                0.6s
                ease
                forwards;
        }


        @keyframes pulse {

            from {
                transform:
                    scale(0.9);

                opacity:
                    0.45;
            }

            to {
                transform:
                    scale(1.15);

                opacity:
                    1;
            }

        }


        @keyframes iconPop {

            0% {
                transform:
                    scale(0)
                    rotate(-10deg);

                opacity:
                    0;
            }

            65% {
                transform:
                    scale(1.2)
                    rotate(4deg);

                opacity:
                    1;
            }

            100% {
                transform:
                    scale(1)
                    rotate(0deg);

                opacity:
                    1;
            }

        }


        @keyframes fadeDown {

            from {
                opacity:
                    0;

                transform:
                    translateY(-10px);
            }

            to {
                opacity:
                    1;

                transform:
                    translateY(0);
            }

        }


        @keyframes messageReveal {

            from {
                opacity:
                    0;

                transform:
                    translateY(20px)
                    scale(0.96);
            }

            to {
                opacity:
                    1;

                transform:
                    translateY(0)
                    scale(1);
            }

        }



        /*
            Slight adjustment for smaller phones.
        */

        @media (max-width: 420px) {

            body {
                padding: 16px;
            }

            .card {
                padding:
                    32px
                    22px;

                border-radius:
                    25px;
            }

            .icon {
                font-size:
                    70px;
            }

            h1 {
                font-size:
                    21px;
            }

            #message {
                font-size:
                    24px;
            }

            button {
                font-size:
                    17px;

                width:
                    100%;
            }

        }



        /*
            Respect accessibility settings.
        */

        @media (prefers-reduced-motion: reduce) {

            *,
            *::before,
            *::after {

                animation-duration:
                    0.01ms !important;

                animation-iteration-count:
                    1 !important;

                transition-duration:
                    0.01ms !important;

            }

        }

    </style>

</head>



<body>


    <div id="backgroundLayer"></div>


    <div
        class="card"
        id="card"
    >


        <div
            class="icon"
            id="icon"
        >
            ✨
        </div>


        <h1 id="title">
            A little positivity for you
        </h1>


        <div id="message"></div>


        <button
            id="anotherButton"
            onclick="showMessage()"
        >
            Give me another ✨
        </button>


        <div class="footer">
            Take what you need today.
        </div>


    </div>



    <!--
        Our separate library containing
        all 500 Positive Pins messages.
    -->

    <script src="messages.js"></script>



    <script>


        /*
        ==========================================
        COLOUR SCHEMES
        ==========================================

        Each theme gets:

        start:
            First background colour

        end:
            Second background colour

        accent:
            Used for the heading,
            border and button

        glow:
            Used around the white card
        */


        const themeStyles = {


            frog: {
                start: "#dff7df",
                end: "#c9f1e5",
                accent: "#397a52",
                glow: "rgba(57, 122, 82, 0.25)"
            },


            bee: {
                start: "#fff4b8",
                end: "#ffe1a8",
                accent: "#8a6518",
                glow: "rgba(138, 101, 24, 0.25)"
            },


            cat: {
                start: "#ffe0ec",
                end: "#efe1ff",
                accent: "#8b5689",
                glow: "rgba(139, 86, 137, 0.25)"
            },


            dog: {
                start: "#ffe4c7",
                end: "#fff1d9",
                accent: "#93633d",
                glow: "rgba(147, 99, 61, 0.25)"
            },


            turtle: {
                start: "#d7f3df",
                end: "#d8f1ec",
                accent: "#477c61",
                glow: "rgba(71, 124, 97, 0.25)"
            },


            butterfly: {
                start: "#eadcff",
                end: "#ffdff5",
                accent: "#795a9c",
                glow: "rgba(121, 90, 156, 0.25)"
            },


            sunflower: {
                start: "#fff0a8",
                end: "#fff8cf",
                accent: "#9a7417",
                glow: "rgba(154, 116, 23, 0.25)"
            },


            rainbow: {
                start: "#ffdce9",
                end: "#dff4ff",
                accent: "#7b5c92",
                glow: "rgba(123, 92, 146, 0.25)"
            },


            star: {
                start: "#e7e5ff",
                end: "#fff1bd",
                accent: "#655b9a",
                glow: "rgba(101, 91, 154, 0.25)"
            },


            moon: {
                start: "#dce3ff",
                end: "#e9ddff",
                accent: "#555c91",
                glow: "rgba(85, 92, 145, 0.28)"
            },


            cloud: {
                start: "#e5edf2",
                end: "#f2f5f7",
                accent: "#657784",
                glow: "rgba(101, 119, 132, 0.22)"
            },


            mushroom: {
                start: "#ead9cc",
                end: "#e5d9ef",
                accent: "#775969",
                glow: "rgba(119, 89, 105, 0.25)"
            },


            dinosaur: {
                start: "#d9efcf",
                end: "#e8f0bf",
                accent: "#56753e",
                glow: "rgba(86, 117, 62, 0.25)"
            },


            dragon: {
                start: "#e6d9ff",
                end: "#ffd9dc",
                accent: "#735580",
                glow: "rgba(115, 85, 128, 0.28)"
            },


            unicorn: {
                start: "#ffdcef",
                end: "#e0e5ff",
                accent: "#8b5a9c",
                glow: "rgba(139, 90, 156, 0.25)"
            },


            penguin: {
                start: "#d9efff",
                end: "#e9f7ff",
                accent: "#486e89",
                glow: "rgba(72, 110, 137, 0.25)"
            },


            otter: {
                start: "#d9eee9",
                end: "#eadcc9",
                accent: "#58786e",
                glow: "rgba(88, 120, 110, 0.25)"
            },


            hedgehog: {
                start: "#f0dfca",
                end: "#f9eadc",
                accent: "#80634e",
                glow: "rgba(128, 99, 78, 0.25)"
            },


            rocket: {
                start: "#dbe3ff",
                end: "#eadcff",
                accent: "#535e9c",
                glow: "rgba(83, 94, 156, 0.28)"
            },


            d20: {
                start: "#dce8ff",
                end: "#e5dcff",
                accent: "#5b5a9a",
                glow: "rgba(91, 90, 154, 0.28)"
            },


            dnd: {
                start: "#e8dcff",
                end: "#f5dfc7",
                accent: "#775b91",
                glow: "rgba(119, 91, 145, 0.28)"
            },


            doughnut: {
                start: "#ffdce8",
                end: "#ffe7d2",
                accent: "#a35d78",
                glow: "rgba(163, 93, 120, 0.25)"
            },


            cookie: {
                start: "#f3dfc6",
                end: "#fff0d7",
                accent: "#896044",
                glow: "rgba(137, 96, 68, 0.25)"
            },


            strawberry: {
                start: "#ffd7df",
                end: "#ffe8d9",
                accent: "#a34f65",
                glow: "rgba(163, 79, 101, 0.25)"
            },


            general: {
                start: "#fff0f6",
                end: "#eef8ff",
                accent: "#6f627b",
                glow: "rgba(111, 98, 123, 0.22)"
            }

        };



        let previousTheme =
            -1;


        let previousMessage =
            -1;


        let revealing =
            false;



        /*
        ==========================================
        APPLY THEME COLOURS
        ==========================================
        */


        function applyThemeColours(theme) {


            const style =
                themeStyles[theme.id] ||
                themeStyles.general;


            const background =
                `linear-gradient(
                    135deg,
                    ${style.start},
                    ${style.end}
                )`;


            document
                .getElementById(
                    "backgroundLayer"
                )
                .style
                .background =
                background;


            const card =
                document.getElementById(
                    "card"
                );


            card.style.borderColor =
                style.accent + "55";


            card.style.boxShadow =
                `
                0 15px 45px
                ${style.glow}
                `;


            const title =
                document.getElementById(
                    "title"
                );


            title.style.color =
                style.accent;


            const button =
                document.getElementById(
                    "anotherButton"
                );


            button.style.background =
                style.accent;


            button.style.boxShadow =
                `
                0 5px 18px
                ${style.glow}
                `;


            /*
                Also changes the browser's
                mobile toolbar colour
                where supported.
            */

            document
                .getElementById(
                    "themeColour"
                )
                .setAttribute(
                    "content",
                    style.start
                );

        }



        /*
        ==========================================
        SHOW RANDOM MESSAGE
        ==========================================
        */


        function showMessage() {


            if (revealing) {
                return;
            }


            revealing =
                true;


            const themes =
                window.positivePinThemes;


            if (
                !themes ||
                themes.length === 0
            ) {

                document
                    .getElementById(
                        "message"
                    )
                    .textContent =
                    "Something went wrong loading the messages.";


                revealing =
                    false;


                return;
            }



            /*
            ------------------------------
            CHOOSE RANDOM THEME
            ------------------------------
            */


            let themeNumber;


            do {

                themeNumber =
                    Math.floor(
                        Math.random() *
                        themes.length
                    );

            } while (

                themeNumber ===
                previousTheme

                &&

                themes.length > 1

            );


            const theme =
                themes[
                    themeNumber
                ];



            /*
            ------------------------------
            CHOOSE RANDOM MESSAGE
            ------------------------------
            */


            let messageNumber;


            do {

                messageNumber =
                    Math.floor(
                        Math.random() *
                        theme.messages.length
                    );

            } while (

                themeNumber ===
                previousTheme

                &&

                messageNumber ===
                previousMessage

                &&

                theme.messages.length > 1

            );


            previousTheme =
                themeNumber;


            previousMessage =
                messageNumber;



            /*
            ------------------------------
            GET PAGE ELEMENTS
            ------------------------------
            */


            const icon =
                document.getElementById(
                    "icon"
                );


            const title =
                document.getElementById(
                    "title"
                );


            const message =
                document.getElementById(
                    "message"
                );


            const button =
                document.getElementById(
                    "anotherButton"
                );



            /*
            ------------------------------
            RESET PAGE FOR REVEAL
            ------------------------------
            */


            icon.className =
                "icon thinking";


            title.className =
                "";


            message.className =
                "";


            icon.textContent =
                "✨";


            title.textContent =
                "Finding something for you...";


            message.textContent =
                "";


            button.disabled =
                true;


            button.textContent =
                "Finding one... ✨";



            /*
            ------------------------------
            COLOUR TRANSITION
            ------------------------------

            The colours arrive first,
            just before the themed emoji.
            */


            setTimeout(
                function() {

                    applyThemeColours(
                        theme
                    );

                },
                180
            );



            /*
            ------------------------------
            REVEAL ICON
            ------------------------------
            */


            setTimeout(
                function() {

                    icon.className =
                        "icon icon-reveal";


                    icon.textContent =
                        theme.icon;

                },
                450
            );



            /*
            ------------------------------
            REVEAL TITLE
            ------------------------------
            */


            setTimeout(
                function() {

                    title.textContent =
                        theme.title;


                    title.className =
                        "title-reveal";

                },
                720
            );



            /*
            ------------------------------
            REVEAL MESSAGE
            ------------------------------
            */


            setTimeout(
                function() {

                    message.textContent =
                        theme.messages[
                            messageNumber
                        ];


                    message.className =
                        "message-reveal";

                },
                980
            );



            /*
            ------------------------------
            FINISH REVEAL
            ------------------------------
            */


            setTimeout(
                function() {

                    button.disabled =
                        false;


                    button.textContent =
                        "Give me another ✨";


                    revealing =
                        false;

                },
                1500
            );

        }



        /*
        ==========================================
        FIRST NFC / PAGE OPEN
        ==========================================

        As soon as the page loads,
        perform the reveal automatically.
        */


        showMessage();


    </script>


</body>

</html>
