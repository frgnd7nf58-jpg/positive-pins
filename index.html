<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Positive Pins</title>

    <style>

        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 100vh;

            display: flex;
            justify-content: center;
            align-items: center;

            padding: 25px;

            font-family: Arial, sans-serif;

            background: linear-gradient(
                135deg,
                #fff0f6,
                #eef8ff
            );
        }

        .card {
            width: 100%;
            max-width: 500px;

            background: white;

            border-radius: 30px;

            padding: 40px 30px;

            text-align: center;

            box-shadow:
                0 10px 30px rgba(0,0,0,0.12);
        }

        .icon {
            font-size: 70px;
        }

        h1 {
            margin-top: 15px;
            font-size: 28px;
        }

        #message {
            margin: 35px 0;

            font-size: 27px;
            font-weight: bold;

            line-height: 1.4;
        }

        button {
            border: none;

            padding: 15px 25px;

            border-radius: 50px;

            font-size: 18px;

            background: #333;
            color: white;

            cursor: pointer;
        }

        .footer {
            margin-top: 30px;

            font-size: 14px;

            color: #777;
        }

    </style>
</head>


<body>

    <div class="card">

        <div class="icon" id="icon">
            ✨
        </div>

        <h1 id="title">
            A little positivity for you
        </h1>

        <div id="message"></div>

        <button onclick="showMessage()">
            Give me another ✨
        </button>

        <div class="footer">
            Take what you need today.
        </div>

    </div>


    <script>

        const themes = {

            general: {
                icon: "✨",

                title: "A little positivity for you",

                messages: [

                    "You are doing better than you think.",

                    "You deserve to be proud of yourself.",

                    "Small steps still move you forward.",

                    "You don't have to be perfect to be brilliant.",

                    "You matter more than you realise.",

                    "Be as kind to yourself as you are to others.",

                    "One difficult day doesn't define you.",

                    "There are brighter days ahead.",

                    "You are capable of more than you realise.",

                    "Today is another chance to surprise yourself.",

                    "Your best is enough.",

                    "Keep going. You've got this."

                ]
            },


            frog: {
                icon: "🐸",

                title: "A little froggy encouragement",

                messages: [

                    "You're doing toadally fine.",

                    "Take the leap. You've got this.",

                    "You're doing better than you think.",

                    "Sometimes you just need to sit on your lily pad and recharge.",

                    "Keep hopping forward.",

                    "You are absolutely ribbiting company.",

                    "Every little hop still moves you forward.",

                    "Don't forget to be kind to yourself."

                ]
            }

        };


        const params =
            new URLSearchParams(window.location.search);


        const requestedTheme =
            params.get("theme") || "general";


        const theme =
            themes[requestedTheme] || themes.general;


        document.getElementById("icon").textContent =
            theme.icon;


        document.getElementById("title").textContent =
            theme.title;


        let previousMessage = -1;


        function showMessage() {

            let number;

            do {

                number = Math.floor(
                    Math.random() *
                    theme.messages.length
                );

            } while (
                number === previousMessage &&
                theme.messages.length > 1
            );


            previousMessage = number;


            document.getElementById("message").textContent =
                theme.messages[number];

        }


        showMessage();

    </script>

</body>

</html>
